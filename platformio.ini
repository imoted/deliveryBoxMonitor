; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[common]
platform = espressif32
board = m5stack-atoms3
framework = arduino
lib_deps =
	m5stack/M5AtomS3@^1.0.0
	fastled/FastLED@^3.7.1
	m5stack/M5Unified@^0.1.16

build_flags =
    -D FILESYSTEM=SPIFFS

; USB経由の書き込み（初回はこちらで焼く）
[env:m5stack-atoms3]
extends = common
upload_port = /dev/ttyACM0

; WiFi経由のOTA書き込み
;   ファーム : pio run -e ota -t upload
;   SPIFFS   : pio run -e ota -t uploadfs
; upload_port には <OTA_HOSTNAME>.local かデバイスのIPアドレスを指定する。
; --auth は data/config.ini の OTA_PASSWORD と一致させること。
[env:ota]
extends = common
upload_protocol = espota
upload_port = boxmonitor.local
upload_flags =
    --port=3232
    --auth=boxmonitor
